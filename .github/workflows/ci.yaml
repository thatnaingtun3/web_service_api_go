name: Continuous Integration
on: push
env:
  DB_NAME: test
  DB_USER: root
  DB_PASSWORD: root
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
jobs:
  run_code_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Fix go.mod version format
        run: |
          # Fix the go version in go.mod to use correct format
          sed -i 's/go 1\.22\.2/go 1.22/' go.mod
      - name: Start MySQL with Docker
        run: |
          # Start MySQL container with proper networking
          docker run --name mysql-test -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=test -p 3306:3306 -d mysql:8.0 --bind-address=0.0.0.0
          
          # Wait for MySQL to start
          sleep 30
          
          # Configure MySQL for external connections
          docker exec mysql-test mysql -u root -proot -e "
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';
            CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
            GRANT ALL PRIVILEGES ON *.* TO 'root'@'localhost' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "
          
          # Verify connection works
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT VERSION();"
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"
      - name: Run formatting and vet
        run: |
          go fmt ./...
          go vet ./...
      - name: Run tests
        env:
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
        run: go test -v ./...
