name: Continuous Integration
on: push
env:
  DB_NAME: test
  DB_USER: root
  DB_PASSWORD: root
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
jobs:
  run_code_checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Fix go.mod version format
        run: |
          # Fix the go version in go.mod to use correct format
          sed -i 's/go 1\.22\.2/go 1.22/' go.mod
      - name: Wait for MySQL to be ready
        run: |
          # Wait for MySQL service to be fully ready
          sleep 10
          # Test connection
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT VERSION();"
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SHOW DATABASES;"
      - name: Run formatting and vet
        run: |
          go fmt ./...
          go vet ./...
      - name: Run tests
        env:
          DB_NAME: ${{ env.DB_NAME }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
        run: go test -v ./...
